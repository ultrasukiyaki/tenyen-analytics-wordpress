name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: composer validate --strict

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find assets -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: chmod +x tools/build-release.sh
      - run: tools/build-release.sh
      - run: unzip -t dist/tenyen-analytics-wordpress-v0.6.2-stable.zip
      - name: Verify archive exclusions
        run: |
          ! unzip -Z1 dist/tenyen-analytics-wordpress-v0.6.2-stable.zip |
            grep -E '(^|/)(\.git|\.github|tests|tools|vendor|node_modules|dist)(/|$)|\.mmdb$|\.log$|composer\.lock$'
